<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сканер товару</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0 auto;
    padding: 16px;
    max-width: 600px;
    background: #f1f3f5;
    color: #222;
}

h2 {
    text-align: center;
}

.camera {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 14px;
    background: #111;
}

video {
    display: block;
    width: 100%;
    min-height: 260px;
    object-fit: cover;
}

.scan-frame {
    position: absolute;
    width: 82%;
    height: 90px;
    top: 50%;
    left: 9%;
    transform: translateY(-50%);
    border: 3px solid #27e66b;
    border-radius: 12px;
    box-shadow: 0 0 0 999px rgba(0,0,0,.2);
    pointer-events: none;
}

.scan-hint {
    position: absolute;
    bottom: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    text-shadow: 0 1px 4px black;
}

.panel {
    background: white;
    padding: 16px;
    margin-top: 14px;
    border-radius: 12px;
}

.status {
    font-size: 17px;
    font-weight: bold;
}

.barcode {
    display: block;
    margin-top: 10px;
    font-size: 26px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.number {
    font-size: 32px;
    font-weight: bold;
}

.success {
    background: #d9f7df;
    border: 2px solid #229c46;
}

button {
    display: block;
    width: 100%;
    padding: 18px;
    margin-top: 14px;
    font-size: 18px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
    color: white;
    background: #198754;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>Приймання товару</h2>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-frame"></div>
    <div class="scan-hint">Наведіть штрихкод у рамку</div>
</div>

<button id="finishBtn">
    ✓ ЗАВЕРШИТИ СКАНУВАННЯ
</button>

<div class="panel">
    Статус:
    <div class="status" id="status">
        Підготовка камери...
    </div>
</div>

<div class="panel" id="resultPanel">
    Останній штрихкод:
    <span class="barcode" id="result">—</span>
</div>

<div class="panel">
    Кількість сканувань:
    <div class="number" id="count">0</div>
</div>

<script type="module">

const video = document.getElementById("video");
const status = document.getElementById("status");
const result = document.getElementById("result");
const countLabel = document.getElementById("count");
const finishBtn = document.getElementById("finishBtn");
const resultPanel = document.getElementById("resultPanel");

const params = new URLSearchParams(window.location.search);

const GAS_URL = "https://script.google.com/macros/s/AKfycbx3q_Wcrd9blL96n68it0xVu1lUs3QxxznCHQz8Dc0NzKB5AE-w2TRX91iomqLtH8m-/exec";
const SESSION_ID = params.get("session");

let reader;
let controls;

let count = 0;
let sending = false;
let finished = false;

let lastBarcode = "";
let lastScanTime = 0;

function successSignal() {

    if (navigator.vibrate) {
        navigator.vibrate(150);
    }

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio = new AudioContextClass();

        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.frequency.value = 880;
        gain.gain.value = 0.12;

        osc.start();
        osc.stop(audio.currentTime + 0.15);

        osc.onended = () => audio.close();

    } catch(e) {}
}

async function sendToGas(payload) {

    await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type":"text/plain;charset=UTF-8"
        },
        body: JSON.stringify({
            sessionId: SESSION_ID,
            ...payload
        })
    });
}

async function handleScan(code) {

    if (sending || finished) return;

    const now = Date.now();

    if (
        code === lastBarcode &&
        now - lastScanTime < 1500
    ) {
        return;
    }

    lastBarcode = code;
    lastScanTime = now;

    sending = true;

    successSignal();

    result.textContent = code;

    count++;
    countLabel.textContent = count;

    resultPanel.classList.add("success");

    status.textContent =
        "Передача штрихкоду...";

    try {

        await sendToGas({
            action: "barcode",
            barcode: code
        });

        status.textContent =
            "✓ Готовий до наступного сканування";

    } catch(error) {

        status.textContent =
            "Помилка передачі";

        count--;
        countLabel.textContent = count;
    }

    sending = false;
}

async function startScanner() {

    status.textContent =
        "Запит доступу до камери...";

    const ZXingBrowser =
        await import(
        "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"
        );

    reader =
        new ZXingBrowser.BrowserMultiFormatReader();

    status.textContent =
        "Запуск камери...";

    controls =
        await reader.decodeFromConstraints(
        {
            video: {
                facingMode: "environment"
            }
        },
        video,
        (scanResult) => {

            if (scanResult) {
                handleScan(
                    scanResult.getText()
                );
            }
        });

    status.textContent =
        "Наведіть штрихкод у рамку";
}

async function finishScanning() {

    if (finished) return;

    finished = true;

    finishBtn.disabled = true;

    status.textContent =
        "Завершення...";

    try {

        await sendToGas({
            action: "finish"
        });

        if (controls) {
            controls.stop();
        }

        if (video.srcObject) {
            video.srcObject
                .getTracks()
                .forEach(track => track.stop());
        }

        status.textContent =
            "✓ Сканування завершено";

    } catch(error) {

        finished = false;
        finishBtn.disabled = false;

        status.textContent =
            "Помилка завершення";
    }
}

finishBtn.addEventListener(
    "click",
    finishScanning
);

window.addEventListener(
    "beforeunload",
    () => {
        if (controls) {
            controls.stop();
        }
    }
);

startScanner().catch(error => {

    status.textContent =
        "Помилка запуску камери: " +
        error.message;

});

</script>
</body>
</html>
