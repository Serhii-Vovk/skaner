<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сканер товару</title>

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    margin:0 auto;
    padding:16px;
    max-width:600px;
    background:#f1f3f5;
}

h2{
    text-align:center;
}

.camera{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    background:#111;
}

video{
    width:100%;
    min-height:260px;
    object-fit:cover;
}

.scan-frame{
    position:absolute;
    width:82%;
    height:90px;
    top:50%;
    left:9%;
    transform:translateY(-50%);
    border:3px solid #27e66b;
    border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,.2);
    pointer-events:none;
}

.scan-hint{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:#fff;
}

.panel{
    background:#fff;
    padding:15px;
    margin-top:12px;
    border-radius:12px;
}

.status{
    font-weight:bold;
    font-size:18px;
}

.barcode{
    display:block;
    margin-top:10px;
    font-size:26px;
    font-weight:bold;
    word-break:break-all;
}

.number{
    font-size:32px;
    font-weight:bold;
}

.success{
    background:#d9f7df;
    border:2px solid #229c46;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#198754;
    color:white;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>Приймання товару</h2>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-frame"></div>
    <div class="scan-hint">Наведіть штрихкод у рамку</div>
</div>

<button id="finishBtn">
✓ ЗАВЕРШИТИ СКАНУВАННЯ
</button>

<div class="panel">
    Статус:
    <div id="status" class="status">
        Підготовка...
    </div>
</div>

<div class="panel" id="resultPanel">
    Останній код:
    <span id="result" class="barcode">—</span>
</div>

<div class="panel">
    Кількість сканувань:
    <div id="count" class="number">0</div>
</div>

<script type="module">

const video = document.getElementById("video");
const status = document.getElementById("status");
const result = document.getElementById("result");
const countLabel = document.getElementById("count");
const finishBtn = document.getElementById("finishBtn");
const resultPanel = document.getElementById("resultPanel");

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzlC1VhTZ3fs0QdttEZ52Jia0DHhDSny9sL43zDebi4DfCQ91660RKPvq8EfyzPV9Lm/exec";

let reader;
let controls;

let count = 0;
let sending = false;
let finished = false;

let lastBarcode = "";
let lastScanTime = 0;

function beep() {

    try {

        if (navigator.vibrate) {
            navigator.vibrate(150);
        }

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio = new AudioContextClass();

        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.frequency.value = 900;
        gain.gain.value = 0.15;

        osc.start();
        osc.stop(audio.currentTime + 0.15);

        osc.onended = () => audio.close();

    } catch(e){}
}

async function sendToGas(barcode){

    const body = {
        action:"barcode",
        barcode:barcode
    };

    const response = await fetch(GAS_URL,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
    });

    return response;
}

async function handleScan(code){

    if(finished || sending) return;

    const now = Date.now();

    if(
        code === lastBarcode &&
        now - lastScanTime < 1500
    ){
        return;
    }

    lastBarcode = code;
    lastScanTime = now;

    sending = true;

    result.textContent = code;
    resultPanel.classList.add("success");

    status.textContent = "Надсилання...";

    try{

        await sendToGas(code);

        count++;
        countLabel.textContent = count;

        beep();

        status.textContent =
            "✓ Збережено";

    }catch(error){

        status.textContent =
            "ПОМИЛКА: " + error.message;
    }

    sending = false;
}

async function startScanner(){

    status.textContent =
        "Завантаження сканера...";

    const ZXingBrowser = await import(
        "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"
    );

    reader =
        new ZXingBrowser.BrowserMultiFormatReader();

    controls =
        await reader.decodeFromConstraints(
        {
            video:{
                facingMode:"environment"
            }
        },
        video,
        (scanResult)=>{

            if(scanResult){

                handleScan(
                    scanResult.getText()
                );
            }
        }
    );

    status.textContent =
        "Наведіть штрихкод";
}

async function finishScanning(){

    finished = true;

    try{

        if(controls){
            controls.stop();
        }

        if(video.srcObject){
            video.srcObject
                .getTracks()
                .forEach(t=>t.stop());
        }

        status.textContent =
            "Сканування завершено";

    }catch(e){}
}

finishBtn.addEventListener(
    "click",
    finishScanning
);

startScanner().catch(error=>{

    status.textContent =
        error.message;
});
</script>

</body>
</html>
