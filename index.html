
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сканер товару</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0 auto;
    padding: 16px;
    max-width: 600px;
    background: #f1f3f5;
}

h2 {
    text-align: center;
}

/* Вікно камери */
.camera {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    background: #111;
}

video {
    display: block;
    width: 100%;
    min-height: 260px;
    object-fit: cover;
}

/* Рамка сканування */
.scan-frame {
    position: absolute;
    width: 82%;
    height: 90px;
    top: 50%;
    left: 9%;
    transform: translateY(-50%);

    /* Початковий колір — білий */
    border: 3px solid #ffffff;
    border-radius: 12px;

    /* Затемнення навколо рамки — 70% */
    box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.70);

    pointer-events: none;
    z-index: 2;

    transition: border-color 0.15s ease;
}

/* Зелена рамка після сканування */
.scan-frame.scanned {
    border-color: #00ff55;
}

.scan-hint {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #fff;
    z-index: 3;
    pointer-events: none;
}

.panel {
    background: #fff;
    padding: 15px;
    margin-top: 12px;
    border-radius: 12px;
}

.status {
    font-weight: bold;
    font-size: 18px;
}

.barcode {
    display: block;
    margin-top: 10px;
    font-size: 26px;
    font-weight: bold;
    word-break: break-all;
}

.number {
    font-size: 32px;
    font-weight: bold;
}

.success {
    background: #d9f7df;
    border: 2px solid #229c46;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    background: #198754;
    color: white;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
}

button:disabled {
    opacity: .65;
    cursor: wait;
}
</style>
</head>

<body>

<h2>Приймання товару</h2>

<div class="camera">

    <video id="video" autoplay muted playsinline></video>

    <div class="scan-frame"></div>

    <div class="scan-hint">
        Наведіть штрихкод у рамку
    </div>

</div>

<button id="closeBtn">
    ✕ ЗАКРИТИ СКАНЕР
</button>

<div class="panel">
    Статус:
    <div id="status" class="status">
        Підготовка...
    </div>
</div>

<div class="panel" id="resultPanel">
    Останній код:
    <span id="result" class="barcode">—</span>
</div>

<div class="panel">
    Кількість сканувань:
    <div id="count" class="number">0</div>
</div>

<script type="module">

const video = document.getElementById("video");
const status = document.getElementById("status");
const result = document.getElementById("result");
const countLabel = document.getElementById("count");
const closeBtn = document.getElementById("closeBtn");
const resultPanel = document.getElementById("resultPanel");
const scanFrame = document.querySelector(".scan-frame");

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzlC1VhTZ3fs0QdttEZ52Jia0DHhDSny9sL43zDebi4DfCQ91660RKPvq8EfyzPV9Lm/exec";

let reader;
let controls;

let count = 0;
let sending = false;
let finished = false;

let lastBarcode = "";
let lastScanTime = 0;

let frameResetTimer = null;


/* =====================================
   ЗВУКОВИЙ СИГНАЛ
===================================== */

function beep() {

    try {

        if (navigator.vibrate) {
            navigator.vibrate(150);
        }

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        const audio = new AudioContextClass();

        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.frequency.value = 900;
        gain.gain.value = 0.15;

        osc.start();
        osc.stop(audio.currentTime + 0.15);

        osc.onended = () => audio.close();

    } catch(e) {
        console.log("Помилка звуку:", e);
    }
}


/* =====================================
   ВІДПРАВЛЕННЯ ШТРИХКОДУ В GOOGLE SHEETS
===================================== */

async function sendToGas(barcode) {

    const body = new URLSearchParams();

    body.append("action", "barcode");
    body.append("barcode", barcode);

    return fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",

        headers: {
            "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body: body.toString()
    });
}


/* =====================================
   ОБРОБКА СКАНУВАННЯ
===================================== */

async function handleScan(code) {

    if (finished || sending) return;

    const now = Date.now();

    // Захист від повторного зчитування того самого коду
    // протягом 1500 мс
    if (
        code === lastBarcode &&
        now - lastScanTime < 1500
    ) {
        return;
    }

    lastBarcode = code;
    lastScanTime = now;

    sending = true;

    // Скасовуємо попередній таймер рамки
    clearTimeout(frameResetTimer);

    // Змінюємо рамку на зелений колір
    scanFrame.classList.add("scanned");

    // Відображаємо штрихкод
    result.textContent = code;

    resultPanel.classList.add("success");

    status.textContent = "Надсилання...";

    try {

        await sendToGas(code);

        // Збільшуємо кількість сканувань
        count++;

        countLabel.textContent = count;

        // Звуковий сигнал та вібрація
        beep();

        status.textContent = "Штрихкод відскановано";

    } catch(error) {

        status.textContent =
            "ПОМИЛКА: " + error.message;

    } finally {

        sending = false;

        // Через 500 мс повертаємо рамку до білого кольору
        frameResetTimer = setTimeout(() => {

            scanFrame.classList.remove("scanned");

        }, 500);

    }
}


/* =====================================
   ЗАПУСК СКАНЕРА
===================================== */

async function startScanner() {

    status.textContent = "Завантаження сканера...";

    try {

        const ZXingBrowser = await import(
            "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"
        );

        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(

            {
                video: {
                    facingMode: "environment"
                }
            },

            video,

            (scanResult) => {

                if (scanResult) {

                    handleScan(scanResult.getText());

                }

            }

        );

        status.textContent = "Наведіть штрихкод";

    } catch(error) {

        status.textContent =
            "Помилка камери: " + error.message;

    }
}


/* =====================================
   ЗУПИНКА КАМЕРИ
===================================== */

function stopCamera() {

    try {

        if (controls) {
            controls.stop();
        }

        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(track => track.stop());

            video.srcObject = null;

        }

    } catch(e) {

        console.log(e);

    }
}


/* =====================================
   ЗАКРИТТЯ СКАНЕРА
===================================== */

async function closeScanner() {

    if (finished) return;

    closeBtn.disabled = true;
    closeBtn.textContent = "ЗАКРИТТЯ...";

    // Чекаємо завершення відправлення останнього коду
    while (sending) {

        await new Promise(resolve =>
            setTimeout(resolve, 100)
        );

    }

    finished = true;

    clearTimeout(frameResetTimer);

    stopCamera();

    status.textContent =
        "Сканер закрито. Повернення до застосунку...";

    try {

        if (window.opener && !window.opener.closed) {

            window.opener.postMessage(
                { type: "scanner-closed" },
                "*"
            );

            window.opener.focus();

        }

    } catch(e) {}

    window.close();

    // Якщо браузер заборонив закриття вкладки
    setTimeout(() => {

        if (!window.closed) {

            window.location.replace(GAS_URL);

        }

    }, 350);

}


/* =====================================
   КНОПКА ЗАКРИТТЯ
===================================== */

closeBtn.addEventListener("click", closeScanner);


/* =====================================
   ЗАПУСК
===================================== */

startScanner();

</script>

</body>
</html>
