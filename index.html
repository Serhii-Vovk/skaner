<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сканер товару</title>

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    margin:0 auto;
    padding:16px;
    max-width:600px;
    background:#f1f3f5;
}

h2{text-align:center}

.camera{
    position:relative;
    overflow:hidden;
    border-radius:12px;
    background:#111;
}

video{
    width:100%;
    min-height:260px;
    object-fit:cover;
}

.scan-frame{
    position:absolute;
    width:82%;
    height:90px;
    top:50%;
    left:9%;
    transform:translateY(-50%);
    border:3px solid #27e66b;
    border-radius:12px;
    box-shadow:0 0 0 999px rgba(0,0,0,.2);
    pointer-events:none;
}

.scan-hint{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:#fff;
}

.panel{
    background:#fff;
    padding:15px;
    margin-top:12px;
    border-radius:12px;
}

.status{
    font-weight:bold;
    font-size:18px;
}

.barcode{
    display:block;
    margin-top:10px;
    font-size:26px;
    font-weight:bold;
    word-break:break-all;
}

.number{
    font-size:32px;
    font-weight:bold;
}

.success{
    background:#d9f7df;
    border:2px solid #229c46;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#198754;
    color:white;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
}

button:disabled{
    opacity:.65;
    cursor:wait;
}
</style>
</head>
<body>

<h2>Приймання товару</h2>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-frame"></div>
    <div class="scan-hint">Наведіть штрихкод у рамку</div>
</div>

<button id="closeBtn">✕ ЗАКРИТИ СКАНЕР</button>

<div class="panel">
    Статус:
    <div id="status" class="status">Підготовка...</div>
</div>

<div class="panel" id="resultPanel">
    Останній код:
    <span id="result" class="barcode">—</span>
</div>

<div class="panel">
    Кількість сканувань:
    <div id="count" class="number">0</div>
</div>

<script type="module">
const video = document.getElementById("video");
const status = document.getElementById("status");
const result = document.getElementById("result");
const countLabel = document.getElementById("count");
const closeBtn = document.getElementById("closeBtn");
const resultPanel = document.getElementById("resultPanel");

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzlC1VhTZ3fs0QdttEZ52Jia0DHhDSny9sL43zDebi4DfCQ91660RKPvq8EfyzPV9Lm/exec";

let reader;
let controls;
let count = 0;
let sending = false;
let finished = false;
let lastBarcode = "";
let lastScanTime = 0;

function beep() {
    try {
        if (navigator.vibrate) navigator.vibrate(150);

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContextClass();
        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.connect(gain);
        gain.connect(audio.destination);
        osc.frequency.value = 900;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(audio.currentTime + 0.15);
        osc.onended = () => audio.close();
    } catch(e) {}
}

async function sendToGas(barcode) {
    const body = new URLSearchParams();
    body.append("action", "barcode");
    body.append("barcode", barcode);

    // no-cors: браузер не дозволяє прочитати відповідь Apps Script.
    // Успішне завершення fetch означає лише, що запит відправлено.
    return fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: body.toString()
    });
}

async function handleScan(code) {
    if (finished || sending) return;

    const now = Date.now();
    if (code === lastBarcode && now - lastScanTime < 1500) return;

    lastBarcode = code;
    lastScanTime = now;
    sending = true;

    result.textContent = code;
    resultPanel.classList.add("success");
    status.textContent = "Надсилання...";

    try {
        await sendToGas(code);
        count++;
        countLabel.textContent = count;
        beep();
        status.textContent = "Запит відправлено";
    } catch(error) {
        status.textContent = "ПОМИЛКА: " + error.message;
    } finally {
        sending = false;
    }
}

async function startScanner() {
    status.textContent = "Завантаження сканера...";

    const ZXingBrowser = await import(
        "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm"
    );

    reader = new ZXingBrowser.BrowserMultiFormatReader();

    controls = await reader.decodeFromConstraints(
        { video: { facingMode: "environment" } },
        video,
        (scanResult) => {
            if (scanResult) handleScan(scanResult.getText());
        }
    );

    status.textContent = "Наведіть штрихкод";
}

function stopCamera() {
    try {
        if (controls) controls.stop();

        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
    } catch(e) {}
}

async function closeScanner() {
    if (finished) return;

    // Не закриваємо сторінку посеред відправлення останнього штрихкоду.
    closeBtn.disabled = true;
    closeBtn.textContent = "ЗАКРИТТЯ...";

    while (sending) {
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    finished = true;
    stopCamera();
    status.textContent = "Сканер закрито. Повернення до застосунку...";

    // Якщо сканер відкрили кнопкою з Apps Script — повертаємо фокус
    // у вкладку застосунку та надсилаємо їй сигнал для негайного оновлення.
    try {
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "scanner-closed" }, "*");
            window.opener.focus();
        }
    } catch(e) {}

    // Закриття працює, якщо вкладку відкрив сам застосунок через window.open().
    window.close();

    // Якщо браузер заборонив window.close(), повертаємо цю вкладку
    // безпосередньо на головну сторінку Apps Script.
    setTimeout(() => {
        if (!window.closed) {
            window.location.replace(GAS_URL);
        }
    }, 350);
}

closeBtn.addEventListener("click", closeScanner);

startScanner().catch(error => {
    status.textContent = error.message;
});
</script>

</body>
</html>
